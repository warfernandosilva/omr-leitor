# OMR Leitor — YAML pronto para colar em ZimaOS > App Store > Custom Install (com Cloudflare Tunnel).
# Acesso público HTTPS: https://app.seudominio.com (configure o hostname no painel do túnel)
# Acesso LAN: http://<ip-do-zima>:8080 (porta literal em "ports"; troque se ocupada)
# Banco: Postgres zerado (init_db cria as tabelas sozinho via create_all)
#
# ─────────────────────────────────────────────────────────────────────────────
# ATENÇÃO: substitua os 4 marcadores TRECHO_* ANTES de colar no Custom Install.
# Este arquivo NÃO usa variável de ambiente de propósito: o ZimaOS não interpola
# (erro "Invalid hostPort" em `ports`, e environment virando literal — o backend
# sobe sem JWT_SECRET e morre). As duas senhas do Postgres precisam ser IGUAIS:
# a do serviço db e a que aparece na DATABASE_URL.
#
# Gere POSTGRES_PASSWORD e JWT_SECRET com (PowerShell):
#   function New-Hex([int]$n) { $b = New-Object byte[] $n
#     $r = [System.Security.Cryptography.RandomNumberGenerator]::Create()
#     $r.GetBytes($b); $r.Dispose(); (($b | ForEach-Object { $_.ToString('x2') }) -join '') }
#   New-Hex 24   -> POSTGRES_PASSWORD
#   New-Hex 32   -> JWT_SECRET (32+ caracteres)
# O CLOUDFLARE_TUNNEL_TOKEN vem de Zero Trust > Networks > Tunnels.
# Depois: Install > Start > abrir https://app.seudominio.com
#
# No painel do Cloudflare (Zero Trust > Networks > Tunnels > seu túnel > Public Hostname):
#   Subdomain: app | Domain: seudominio.com | Service Type: HTTP | URL: frontend:80
# O cloudflared faz conexão de SAÍDA para a Cloudflare — não precisa abrir porta
# no roteador.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: omr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "TRECHO_SENHA_DO_POSTGRES_48_HEX"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      omr-net:
        aliases: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omr"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ghcr.io/warfernandosilva/omr-leitor-backend:latest
    restart: unless-stopped
    environment:
      # A senha aqui tem que ser a MESMA de POSTGRES_PASSWORD do serviço db acima.
      DATABASE_URL: postgresql+psycopg://postgres:TRECHO_SENHA_DO_POSTGRES_48_HEX@db:5432/omr
      JWT_SECRET: "TRECHO_SEGREDO_JWT_64_HEX"
      OMR_ENV: production
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - omr-data:/app/omr-backend/data
      - omr-backups:/app/omr-backend/backups
    networks:
      - omr-net

  frontend:
    image: ghcr.io/warfernandosilva/omr-leitor-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - omr-net

  # Túnel Cloudflare: expõe o frontend via HTTPS sem abrir portas.
  # Fala com o frontend pela rede interna (http://frontend:80); o hostname
  # público é configurado no dashboard do Cloudflare (Public Hostname).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # --protocol http2: cobre ISPs que bloqueiam QUIC/UDP.
    command: tunnel --no-autoupdate --protocol http2 run --token TRECHO_TOKEN_DO_TUNEL_CLOUDFLARE
    depends_on:
      - frontend
    networks:
      - omr-net

volumes:
  pgdata:
  omr-data:
  omr-backups:

# Rede explícita: o Custom Install do ZimaOS isola os containers por padrão
# (sem ela, o backend não resolve o host 'db'). Todas as partes falam por
# nome de serviço dentro desta rede bridge.
networks:
  omr-net:
    driver: bridge