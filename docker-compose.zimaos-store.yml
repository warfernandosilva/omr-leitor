# OMR Leitor — YAML pronto para colar em ZimaOS > App Store > Custom Install.
# Acesso: http://<ip-do-zima>:8080 (FRONTEND_PORT; frontend serve a SPA e faz proxy /api/ -> backend)
# Banco: Postgres zerado (init_db cria as tabelas sozinho via create_all)
#
# Na tela do Custom Install, preencha as variáveis (gere valores fortes, não reuse de outro lugar):
#   POSTGRES_PASSWORD = (senha forte só deste servidor)
#   JWT_SECRET        = (segredo longo aleatório, 32+ caracteres)
# Depois: Install > Start > abrir http://<ip-do-zima>:8080

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: omr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?preencha POSTGRES_PASSWORD no Custom Install}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      omr-net:
        aliases: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omr"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ghcr.io/warfernandosilva/omr-leitor-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?preencha POSTGRES_PASSWORD no Custom Install}@db:5432/omr
      JWT_SECRET: ${JWT_SECRET:?preencha JWT_SECRET no Custom Install}
      OMR_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - omr-data:/app/omr-backend/data
      - omr-backups:/app/omr-backend/backups
    networks:
      - omr-net

  frontend:
    image: ghcr.io/warfernandosilva/omr-leitor-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - omr-net

volumes:
  pgdata:
  omr-data:
  omr-backups:

# Rede explícita: o Custom Install do ZimaOS isola os containers por padrão
# (sem ela, o backend não resolve o host 'db'). Todas as partes falam por
# nome de serviço dentro desta rede bridge.
networks:
  omr-net:
    driver: bridge
