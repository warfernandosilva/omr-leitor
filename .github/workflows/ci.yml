name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omr-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24+: jsdom 30 exige ^22.22.2 || ^24.15.0 || >=26.0.0 (Node 20 quebra o ambiente)
          node-version: 24
          cache: npm
          cache-dependency-path: omr-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: omr-backend/requirements.txt
      # pyzbar precisa da libzbar; opencv precisa da libGL no Linux
      - run: sudo apt-get update && sudo apt-get install -y libzbar0 libgl1
      - run: pip install -r omr-backend/requirements.txt
      # Suíte pytest (conftest.py isola um SQLite por módulo; pytest.ini descobre test_*.py).
      - run: python -m pytest -q
        working-directory: omr-backend
