# Nginx single-origin para o ZimaOS.
# http://192.168.1.219:8080/ -> SPA (dist/)
# http://192.168.1.219:8080/api/ -> backend:8010 (FastAPI)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Upload de folhas pode chegar a 10MB (ver backend main.py) + margem
  client_max_body_size 25m;

  # API -> backend FastAPI
  location /api/ {
    proxy_pass http://backend:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # SPA: arquivos estáticos com cache + fallback para index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Nunca cachear index.html (evita SPA travada em versão antiga)
  location = /index.html {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }
}
